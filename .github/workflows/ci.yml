name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Drafts don't run CI; it starts when the pull request is ready for review.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, unit tests, generated files
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: go mod tidy -diff
      - run: go build ./...
      - run: golangci-lint run ./...
      - run: go test -race ./...
      - name: buf lint and breaking-change check
        run: |
          buf lint proto
          # Nothing to compare against until the contract is on main.
          if git cat-file -e origin/main:proto/buf.yaml 2>/dev/null; then
            buf breaking proto --against ".git#ref=origin/main,subdir=proto"
          fi
        if: github.event_name == 'pull_request'
      - name: generated code and docs are up to date
        run: |
          buf generate
          go tool tfplugindocs generate --provider-name limen
          terraform fmt -recursive -check examples
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status; exit 1; }
      - run: actionlint
      - run: goreleaser check

  acceptance:
    name: acceptance (${{ matrix.cli }} ${{ matrix.version }})
    if: github.event_name == 'push' || !github.event.pull_request.draft
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported and the newest of each CLI.
          - { cli: terraform, version: 1.5.7 }
          - { cli: terraform, version: 1.16.6 }
          - { cli: opentofu, version: 1.6.3 }
          - { cli: opentofu, version: 1.13.2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - name: acceptance tests against the in-memory Limen
        env:
          TF_ACC: "1"
          CLI: ${{ matrix.cli }}
        run: |
          if [ "$CLI" = opentofu ]; then
            TF_ACC_TERRAFORM_PATH="$(command -v tofu)"
            export TF_ACC_TERRAFORM_PATH TF_ACC_PROVIDER_HOST=registry.opentofu.org
          else
            TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
            export TF_ACC_TERRAFORM_PATH
          fi
          go test ./internal/provider/ -count=1 -v -timeout 15m
