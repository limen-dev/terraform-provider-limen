version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
    gosec:
      excludes:
        - G304 # reading files the user named (ca_file, token_file) is the point
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/limen-dev/terraform-provider-limen
